<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World 2.11</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Hello World 2.11</h1>
        <p class="subtitle">We're glad you're here</p>
        <form id="name-form" autocomplete="off">
            <label for="name-input">Please enter your name:</label>
            <input type="text" id="name-input" name="name" placeholder="Your name" required>
            <button type="submit">Say Hello</button>
        </form>
        <div id="welcome-message" aria-live="polite"></div>
    </main>

    <script>
        (function() {
            const form = document.getElementById('name-form');
            const nameInput = document.getElementById('name-input');
            const welcomeMessage = document.getElementById('welcome-message');

            // Check if we already know the user from this session
            const storedName = sessionStorage.getItem('userName');
            if (storedName) {
                showWelcome(storedName, true);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const name = nameInput.value.trim();

                if (name) {
                    // Keep the name in memory during the session
                    sessionStorage.setItem('userName', name);
                    showWelcome(name, storedName ? true : false);
                }
            });

            function showWelcome(name, isReturning) {
                let message;
                if (isReturning) {
                    message = 'Welcome back, ' + name + '! Great to see you again!';
                } else {
                    message = 'Hello, ' + name + '! Welcome! Great to meet you!';
                }
                welcomeMessage.textContent = message;
            }
        })();
    </script>
</body>
</html>
